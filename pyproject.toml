# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddos-attack"
version = "1.0.2"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.23.0",
    "torch==2.7.1",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "xgboost>=2.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "lahu"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "ddos_attack.server_app:app"
clientapp = "ddos_attack.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
exp-id = "exp_lr_fedxgbllr_0.1_N2_fedprox-0.01_test"
num-server-rounds = 5
num-clients = 2
fraction-train = 1
fraction-evaluate = 1
local-epochs = 3
lr = 1e-3
batch-size = 256

# ===== model / strategy / partition =====
model-name = "xgboost"                 # "mlp" | "logistic" | "tab-res-net" | "xgboost"
strategy-name = "fedxgbllr"        # "fedavg" | "fedprox" | "fedxgbbagging" | "fedxgbcyclic" | "fedxgbllr"
partition-mode = "dirichlet"           # "iid" | "dirichlet"
dirichlet-alpha = 0.1

# ===== Loss function (ignored by xgboost branch) =====
loss-type = "ce"
loss-label-smoothing = 0.0
focal-gamma = 2.0

# ===== dataset =====
num-features = 39
num-classes = 13
data-root = "~/projects/ddos-attack/data"

# ===== centralized test =====
do-centralized-test = true
server-test-csv = "C:/Users/dangn/OneDrive/Desktop/flower/ddos-attack/data/test_final.csv"

infer-bench-csv = "~/projects/ddos-attack/data/infer_bench.csv"
output-dir = "outputs"

# ===== lightweight XGBoost params =====
xgb-eta = 0.15
xgb-max-depth = 4
xgb-subsample = 0.8
xgb-colsample-bytree = 0.8
xgb-max-bin = 63
xgb-nthread = 2
xgb-tree-method = "hist"
xgb-objective = "multi:softprob"
xgb-eval-metric = "mlogloss"

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# Local simulation federation with 10 virtual SuperNodes
[tool.flwr.federations.local-simulation]
options.num-supernodes = 4

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
#address = "<SUPERLINK-ADDRESS>:<PORT>"
#insecure = true  # Remove this line to enable TLS
#address = "192.168.137.1:9092"
#address = "192.168.0.107:9093"
address = "192.168.0.10:9093"
insecure = true
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup