# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddos-attack"
version = "1.0.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.23.0",
    "torch==2.7.1",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "lahu"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "ddos_attack.server_app:app"
clientapp = "ddos_attack.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
exp-id = "exp_mlp_non-iid_N3_v1"          # đổi tên tuỳ run
num-server-rounds = 10
num-clients = 3
fraction-train = 1.0
local-epochs = 1
lr = 1e-4
batch-size = 256

# ===== model / partition =====
model-name = "mlp"                # "mlp" | "cnn1d" | "cnn_bilstm"
partition-mode = "dirichlet"            # "iid" | "dirichlet"
dirichlet-alpha = 0.3             # chỉ dùng nếu partition-mode="dirichlet"

# ===== dataset (already MinMax scaled -> DO NOT rescale in code) =====
num-features = 20
num-classes = 13

# Data root OUTSIDE app bundle (important for remote federation)
# On Pi: "/home/ras-pi/ddos_data"
# On PC (optional): "C:/ddos_data"
data-root = "~/projects/ddos-attack/data"

# Centralized test (server-side on PC)
do-centralized-test = true
server-test-csv = "C:/Users/lanh2/Documents/HocTap/NamHoc_2023_2024/luanvan/flower/ddos-attack/data/test_final.csv"

# Inference benchmark (run separately on Pi after FL)
infer-bench-csv = "~/projects/ddos-attack/data/infer_bench.csv"

# Where to write outputs (server)
output-dir = "outputs"

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# Local simulation federation with 10 virtual SuperNodes
[tool.flwr.federations.local-simulation]
options.num-supernodes = 4

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
#address = "<SUPERLINK-ADDRESS>:<PORT>"
#insecure = true  # Remove this line to enable TLS
#address = "192.168.137.1:9092"
address = "192.168.0.107:9093"
insecure = true
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup
